<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Conteúdos – IdeaPlanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="app-body">

  <nav class="nav nav--app">
    <a th:href="@{/}" class="nav__logo">Idea<span>Planner</span></a>
    <a th:href="@{/posts/new}" class="btn btn--primary btn--sm">+ Nova ideia</a>
  </nav>

  <main class="app-main">
    <div class="page-header">
      <h1>Meus conteúdos</h1>
      <p th:text="${posts.size()} + ' registros encontrados'"></p>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="IDEIA">Ideia</button>
      <button class="filter-btn" data-filter="RASCUNHO">Rascunho</button>
      <button class="filter-btn" data-filter="PUBLICADO">Publicado</button>
    </div>

    <div class="table-wrap">
      <table class="posts-table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Plataforma</th>
            <th>Status</th>
            <th>Data prevista</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="post : ${posts}" 
              th:data-status="${post.status}"
              th:data-href="@{/posts/{id}(id=${post.id})}"
              class="tr--clickable">       
            <td class="td--title" th:text="${post.titulo}"></td>
            <td>
              <span class="badge"
                    th:classappend="'badge--' + ${post.plataforma.toLowerCase()}"
                    th:text="${post.plataforma}"></span>
            </td>
            <td>
              <span class="status-dot"
                    th:classappend="'status--' + ${post.status.toLowerCase()}"
                    th:text="${post.status}"></span>
            </td>
            <td class="td--data" th:text="${post.dataPrevista}"></td>
          </tr>
          <tr th:if="${posts.isEmpty()}">
            <td colspan="4" class="td--empty">
              Nenhum conteúdo ainda. <a th:href="@{/posts/new}">Criar primeira ideia →</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
